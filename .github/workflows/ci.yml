name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 只装 dev 依赖：核心链路（切分/BM25/RRF/去重/pipeline）为纯标准库，
      # fastapi / chromadb 相关用例会自动 skip，因此 CI 不需要联网下载模型或向量库。
      - name: Install (dev only)
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests -q

      - name: Run offline eval (smoke, no results write)
        run: python eval/run_eval.py --no-write

  api:
    name: pytest + FastAPI layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (dev + api)
        run: python -m pip install -e ".[dev,api]"
      - name: Run tests (service layer included)
        run: python -m pytest tests -q